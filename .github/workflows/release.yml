name: Windows release build

on:
  push:
    branches: [main, st0ny-dev, st0ny-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check Win32 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check source comments
        run: python tools/check_comments.py

      - name: Configure Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build DLLs, shaders and harness
        run: cmake --build build --config Release --parallel

      - name: Run checks that do not require a graphics device
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -LE gpu

      - name: Assemble install files
        run: |
          $package = 'build/package'
          New-Item -ItemType Directory -Path $package | Out-Null
          $files = 'version.dll', 'CoAVolFog.dll', 'CoAVolFog.ini', 'fogdata.bin', 'waterdata.bin'
          foreach ($file in $files) {
            Copy-Item -LiteralPath "build/Release/$file" -Destination $package -ErrorAction Stop
          }
          Copy-Item -LiteralPath README.md, LICENSE -Destination $package -ErrorAction Stop
          Copy-Item -LiteralPath build/_deps/imgui-src/LICENSE.txt -Destination "$package/Dear-ImGui-LICENSE.txt"
          @(
            "Commit: $env:GITHUB_SHA"
            "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Configuration: Win32 Release'
            'Validation: build, source comments and CPU harness passed.'
            'D3D9 graphics checks and in-game validation were not run.'
          ) | Set-Content -Path "$package/BUILD.txt" -Encoding utf8

      - name: Upload install archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CoAVolFog-Win32-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/Testing/Temporary/
            build/cpu-harness-out/harness.log
            build/Release/CoAVolFog.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish the install archive as a release
    needs: build
    if: >-
      github.ref == 'refs/heads/st0ny-main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download install files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: CoAVolFog-Win32-${{ github.sha }}
          path: package

      - name: Zip install files
        run: |
          cd package
          zip -r ../CoAVolFog-Win32.zip .

      - name: Create or refresh the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${SHA:0:7}"
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${BRANCH} has moved on to ${head:0:7}; the superseded build ${short} gets no release"
            exit 0
          fi
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.prerelease | not) | select(.tag_name | test("^build-[0-9]+$")) |
                  "\(.tag_name | ltrimstr("build-")) \(.target_commitish)"')
          number=$(echo "$releases" | awk -v sha="$SHA" '$2 == sha { print $1; exit }')
          if [ -z "$number" ]; then
            highest=$(echo "$releases" | awk 'NF { print $1 }' | sort -n | tail -n 1)
            number=$(( ${highest:-0} + 1 ))
          fi
          tag="build-${number}"
          title="CoAVolFog Build-${number} (${BRANCH} ${short})"
          {
            echo "Win32 Release build of \`${BRANCH}\` at ${short}."
            echo
            echo "With the client closed, unzip \`CoAVolFog-Win32.zip\` into the client folder next to \`Wow.exe\`,"
            echo "replacing \`version.dll\`, \`CoAVolFog.dll\`, \`CoAVolFog.ini\` (the default settings),"
            echo "\`fogdata.bin\` and \`waterdata.bin\`. \`BUILD.txt\` names the commit."
            echo
            echo "Validation: build, source comments and CPU harness passed in [run ${RUN_NUMBER}](${RUN_URL})."
            echo "D3D9 graphics checks and in-game validation were not run."
          } > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" CoAVolFog-Win32.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" CoAVolFog-Win32.zip --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --title "$title" --notes-file notes.md
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Delete every older release
        if: ${{ steps.publish.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if ! older=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name'); then
            echo "::warning::the releases could not be listed, so the older ones stay"
            exit 0
          fi
          for old in $older; do
            [ "$old" = "$TAG" ] && continue
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ||
              echo "::warning::the older release ${old} could not be deleted"
          done

  test-release:
    name: Publish or remove the test release of st0ny-dev
    needs: build
    if: >-
      github.ref == 'refs/heads/st0ny-dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download install files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: CoAVolFog-Win32-${{ github.sha }}
          path: package

      - name: Zip install files
        run: |
          cd package
          zip -r ../CoAVolFog-Win32.zip .

      - name: Replace the test release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          MAIN: st0ny-main
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${SHA:0:7}"
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${BRANCH} has moved on to ${head:0:7}; the superseded build ${short} gets no test release"
            exit 0
          fi
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | "\(.tag_name) \(.prerelease) \(.published_at)"')
          tests=$(echo "$releases" | awk '$1 ~ /^build-[0-9]+(-[0-9]+)?-test$/ { print $1 }')
          for old in $tests; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ||
              echo "::warning::the old test release ${old} could not be deleted"
          done
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MAIN}...${SHA}" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "::notice::${MAIN} already contains ${short}; no test release"
            exit 0
          fi
          newest=$(echo "$releases" |
            awk '$2 == "false" && $1 ~ /^build-[0-9]+$/ { sub("build-", "", $1); print $1, $3 }' | sort -n | tail -n 1)
          highest=${newest%% *}
          number=$(( ${highest:-0} + 1 ))
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${BRANCH}&status=success"
          if [ -n "$newest" ]; then
            runs="${runs}&created=%3E${newest#* }"
          fi
          earlier=$(gh api "${runs}&per_page=1" --jq .total_count)
          attempt=$(( earlier + 1 ))
          tag="build-${number}-${attempt}-test"
          title="CoAVolFog TEST Build-${number}-${attempt} (${BRANCH} ${short})"
          {
            echo "**Test build, not a release.** It is test build ${attempt} of the candidate for build ${number}:"
            echo "\`${BRANCH}\` at ${short}, ${ahead} commit(s) ahead of \`${MAIN}\`. Use it only to test the next"
            echo "version; the current release stays at releases/latest."
            echo
            echo "With the client closed, unzip \`CoAVolFog-Win32.zip\` into the client folder next to \`Wow.exe\`,"
            echo "replacing \`version.dll\`, \`CoAVolFog.dll\`, \`CoAVolFog.ini\` (the default settings),"
            echo "\`fogdata.bin\` and \`waterdata.bin\`. \`BUILD.txt\` names the commit."
            echo
            echo "Validation: build, source comments and CPU harness passed in [run ${RUN_NUMBER}](${RUN_URL})."
            echo "D3D9 graphics checks and in-game validation were not run."
          } > notes.md
          gh release create "$tag" CoAVolFog-Win32.zip --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$SHA" --title "$title" --notes-file notes.md
